<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game | Colorful Edition</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom External CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Custom External JS -->
    <script src="js/script.js" defer></script>
</head>
<body>

<!-- Confetti canvas for victory -->
<canvas id="confettiCanvas"></canvas>

<!-- Top Navigation -->
<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold mb-0">
            <i class="bi bi-controller text-warning me-2"></i>GuessQuest
        </span>
        <button id="quickRestart" class="btn btn-sm btn-outline-light rounded-pill px-3">
            <i class="bi bi-arrow-clockwise me-1"></i> Restart
        </button>
    </div>
</nav>

<!-- Game Card View -->
<main class="game-wrapper">
    <div class="game-card">

        <!-- Title & Hint -->
        <div class="text-center mb-3">
            <h1 class="h3 fw-bold mb-1" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Guess The Secret Number
            </h1>
            <p class="text-muted small mb-0">Pick any number between <strong>1 and 100</strong>.</p>
        </div>

        <!-- Range Bar -->
        <div class="mb-3">
            <div class="d-flex justify-content-between small fw-bold text-muted mb-1">
                <span>Min: <span id="floorLabel" class="text-dark">1</span></span>
                <span class="text-primary">Current Boundaries</span>
                <span>Max: <span id="ceilLabel" class="text-dark">100</span></span>
            </div>
            <div class="range-wrapper">
                <div id="rangeBar" class="range-active" style="width: 100%; margin-left: 0%;"></div>
            </div>
        </div>

        <!-- Stats Header -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="stat-badge">
                    <span class="text-muted"><i class="bi bi-heart-pulse-fill text-danger me-1"></i> Left</span>
                    <span id="attemptsLeft" class="badge bg-danger rounded-pill fs-6">10</span>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-badge">
                    <span class="text-muted"><i class="bi bi-arrow-repeat text-primary me-1"></i> Done</span>
                    <span id="attemptsUsed" class="badge bg-secondary rounded-pill fs-6">0</span>
                </div>
            </div>
        </div>

        <!-- Feedback Banner -->
        <div id="feedbackBanner" class="feedback-banner default mb-3">
            <i class="bi bi-lightbulb-fill fs-5"></i>
            <span id="feedbackText">Tap a number or use the keypad to begin!</span>
        </div>

        <!-- Screen Input Display -->
        <div class="screen-display mb-3" id="displayNum">
            --
        </div>

        <!-- Tab / Section Toggle for 1-100 Matrix -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small fw-bold text-muted">Direct 1-100 Click Board</span>
            <span id="toggleBoardBtn" class="number-board-toggle">Hide Grid</span>
        </div>

        <!-- Interactive 1-100 Board -->
        <div id="boardContainer" class="number-board-container mb-3">
            <div id="numberBoard" class="number-board"></div>
        </div>

        <!-- Numpad (0-9, Backspace, Submit) -->
        <div class="keypad-grid mb-3">
            <button type="button" class="key-btn" data-key="1">1</button>
            <button type="button" class="key-btn" data-key="2">2</button>
            <button type="button" class="key-btn" data-key="3">3</button>
            <button type="button" class="key-btn" data-key="4">4</button>
            <button type="button" class="key-btn" data-key="5">5</button>
            <button type="button" class="key-btn" data-key="6">6</button>
            <button type="button" class="key-btn" data-key="7">7</button>
            <button type="button" class="key-btn" data-key="8">8</button>
            <button type="button" class="key-btn" data-key="9">9</button>
            <button type="button" class="key-btn action-btn" data-action="clear">C</button>
            <button type="button" class="key-btn" data-key="0">0</button>
            <button type="button" class="key-btn action-btn" data-action="backspace"><i class="bi bi-backspace"></i></button>
            <button type="button" id="btnSubmitGuess" class="key-btn submit-btn">
                <i class="bi bi-check-circle-fill me-1"></i> Make Guess
            </button>
        </div>

        <!-- Reset Button (shown prominently when Game Ends) -->
        <button id="btnPlayAgain" class="btn btn-outline-dark w-100 py-2 rounded-pill fw-bold" style="display: none;">
            <i class="bi bi-arrow-repeat me-1"></i> Play Again
        </button>

    </div>
</main>

<footer class="text-center py-2 text-white-50 small">
    Number Guessing Game &bull; Saiket Systems Internship Task
</footer>

</body>
</html>
